<!doctype html>
<html lang="en" data-theme="dark" data-accent="emerald">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="description" content="Personal 3-day full-body lean muscle program tracker with superset timers and progression." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Workout" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-180.png" />
    <link rel="icon" type="image/png" href="%BASE_URL%icons/icon-192.png" />
    <title>Workout</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('wt:settings');
          var s = raw ? JSON.parse(raw) : null;
          var v = s && s.value ? s.value : s || {};
          var theme = v.theme || 'dark';
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.accent = v.accent || 'emerald';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
